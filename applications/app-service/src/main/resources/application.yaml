server:
  port: 8080

spring:
  application:
    name: "RetoReactivo"
  devtools:
    add-properties: false
  h2:
    console:
      enabled: true
      path: "/h2"
  profiles:
    include: null
  r2dbc:
    url: r2dbc:postgresql://database-reactiva.cyjc2g6ec3fc.us-east-1.rds.amazonaws.com:5432/reto_reactivo?sslmode=require
    username: postgres
    password: NuevaPasswordSegura123
    pool:
      enabled: true
      initial-size: 5
      max-size: 20
      max-idle-time: 30m
      max-life-time: 1h
      max-acquire-time: 60s
      max-create-connection-time: 60s
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

logging:
  level:
    org.springframework.r2dbc: INFO
    io.r2dbc.postgresql: INFO
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080"
