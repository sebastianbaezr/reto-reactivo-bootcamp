server:
  port: 8082

spring:
  application:
    name: "RetoReactivoBootcamp"
  devtools:
    add-properties: false
  h2:
    console:
      enabled: true
      path: "/h2"
  profiles:
    include: null
  r2dbc:
    url: r2dbc:postgresql://database-reactiva.cyjc2g6ec3fc.us-east-1.rds.amazonaws.com:5432/reto_reactivo_bootcamp?sslmode=require
    username: postgres
    password: NuevaPasswordSegura123
    pool:
      enabled: true
      initial-size: 5
      max-size: 20
      max-idle-time: 30m
      max-life-time: 1h
      max-acquire-time: 60s
      max-create-connection-time: 60s
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

logging:
  level:
    org.springframework.r2dbc: INFO
    io.r2dbc.postgresql: INFO

management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true

cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080"

external-services:
  services:
    capacity-service:
      base-url: "http://localhost:8081"
      connect-timeout: 3000
      response-timeout: 5
    technology-service:
      base-url: "http://localhost:8080"
      connect-timeout: 3000
      response-timeout: 5
    bootcamp-report-service:
      base-url: "http://localhost:8084"
      connect-timeout: 3000
      response-timeout: 5
    person-service:
      base-url: "http://localhost:8083"
      connect-timeout: 3000
      response-timeout: 5
